[pytest]
pythonpath = .
# Restrict test discovery to your tests folder (skips terraform/ and helper folders)
testpaths = tests

# Standard naming conventions for test files, classes, and functions
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Default CLI flags applied to every run:
# -v: verbose output
# -ra: show summary for all non-passing tests (skipped, xfailed, etc.)
# --strict-markers: fail immediately if an unregistered marker is used (catches typos)
# --tb=short: cleaner, shorter tracebacks for faster debugging
# --slowmo 1000: for slow execution of script (useful for visual debugging)
addopts = -v -ra --strict-markers --tb=short

# Custom markers for CI/CD test filtering (e.g., pytest -m "smoke and not slow")
markers =
    smoke: Quick critical-path checks run on every PR merge
    regression: Full end-to-end test suite
    api: Backend REST/GraphQL API tests
    ui: Browser-based UI automation tests (Playwright/Selenium)
    slow: Tests taking longer than 30 seconds

# Live console logging (shows real-time step logs when a test fails)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter noisy third-party library deprecation warnings
filterwarnings =
    ignore::DeprecationWarning

